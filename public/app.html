<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget</title>
<!-- The app moved from /app.html to /app/ (a cleaner URL, no .html).
     This stub keeps every old bookmarked or shared link working by
     forwarding straight to the new location, query string and hash
     (tab) included - e.g. /app.html?mode=business#team becomes
     /app/?mode=business#team. -->
<script>
  location.replace('/app/' + location.search + location.hash);
</script>
</head>
<body>
<p>Redirecting to <a href="/app/">the app</a>&hellip;</p>
</body>
</html>
